[project]
name = "photocheck"
version = "0.1.0"
description = "Prototype of the facts-rules-verbalization method for checking user photos against requirements with a reasoned conclusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "mediapipe==1.0.1",
    "opencv-contrib-python>=4.10",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pillow>=10",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dataset = ["datasets>=3"]

[project.scripts]
photocheck = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mediapipe: needs installed MediaPipe and downloaded model files",
    "dataset: needs data/valid with source portraits",
]
